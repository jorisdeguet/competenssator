{% extends "base.html" %}
{% block title %}Connexion — Competenssator{% endblock %}

{% block content %}
<div class="columns is-centered">
  <div class="column is-5">
    <div class="card" style="border-radius:12px; border-top: 4px solid #111;">
      <div class="card-content">
        <div class="has-text-centered mb-4">
          <p style="font-size:3rem;">🔑</p>
          <h1 class="title is-3">Connexion</h1>
          <p class="has-text-grey">Entrez votre code à 8 lettres</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
          <div class="field">
            <label class="label">Votre code</label>
            <div class="control">
              <input class="input is-medium" type="text" name="code"
                     placeholder="EX: ABCD1234"
                     maxlength="8" autocomplete="off" autocapitalize="characters"
                     style="font-family:monospace; font-size:1.5rem; letter-spacing:6px; text-transform:uppercase;"
                     autofocus required>
            </div>
            <p class="help">8 caractères, lettres et chiffres uniquement (pas de 0, O, 1, I, L)</p>
          </div>

          <div class="field mt-4">
            <div class="control">
              <button class="button is-dark is-fullwidth is-medium" type="submit">
                <span>Se connecter</span>
                <span style="margin-left:.5rem;">→</span>
              </button>
            </div>
          </div>
        </form>

        <div class="has-text-centered mt-4">
          <a class="has-text-grey" href="{{ url_for('index') }}">← Retour à l'accueil</a>
          &nbsp;|&nbsp;
          <a class="has-text-grey" href="{{ url_for('register') }}">Créer un compte</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.querySelector('input[name=code]').addEventListener('input', function() {
    this.value = this.value.toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g, '');
  });
</script>
{% endblock %}
