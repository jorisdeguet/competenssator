{% extends "base.html" %}
{% block title %}{{ t('join.title') }} — {{ group.cls.name }}{% endblock %}

{% block content %}
<div class="box has-text-centered mb-5" style="border-top: 4px solid #111;">
  <h1 class="title is-3">
    {{ group.name }}
  </h1>
  <p class="subtitle has-text-grey">{{ group.cls.name }}</p>
</div>

<div style="max-width:560px; margin:0 auto;">

  <!-- New student -->
  <div class="box mb-4" style="border-left:4px solid #111;">
    <h2 class="title is-5 mb-3">{{ t('join.new_user') }}</h2>
    <form method="POST">
      <input type="hidden" name="action" value="new">
      <div class="field">
        <label class="label">{{ t('join.your_name') }}</label>
        <div class="control">
          <input class="input" type="text" name="name"
                 placeholder="{{ t('auth.name_placeholder') }}" autofocus>
        </div>
      </div>
      <button class="button is-dark is-fullwidth mt-3" type="submit">
        {{ t('join.create_and_join') }}
      </button>
    </form>
  </div>

  <!-- Existing student -->
  <div class="box" style="border-left:4px solid #555;">
    <h2 class="title is-5 mb-3">{{ t('join.existing_user') }}</h2>
    <p class="has-text-grey mb-3" style="font-size:.85rem;">{{ t('join.existing_hint') }}</p>
    <form method="POST">
      <input type="hidden" name="action" value="existing">
      <div class="field">
        <label class="label">{{ t('join.personal_code_label') }}</label>
        <div class="control">
          <input class="input" type="text" name="personal_code"
                 maxlength="8"
                 style="font-family:monospace; letter-spacing:3px; text-transform:uppercase; font-size:1.1rem;"
                 placeholder="XXXXXXXX"
                 oninput="this.value=this.value.toUpperCase()">
        </div>
      </div>
      <button class="button is-dark is-fullwidth mt-3" type="submit">
        {{ t('join.login_and_join') }}
      </button>
    </form>
  </div>

  <p class="has-text-centered has-text-grey mt-4">
    <a href="{{ url_for('join') }}">{{ t('join.change_code') }}</a>
  </p>
</div>
{% endblock %}
